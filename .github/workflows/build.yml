name: Build and test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (version pinned in global.json)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore src/Telescribe.slnx

      - name: Build
        run: dotnet build src/Telescribe.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --solution src/Telescribe.slnx --configuration Release --no-build

      - name: Check for vulnerable packages
        shell: bash
        run: |
          dotnet list src/Telescribe.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found"
            exit 1
          fi
